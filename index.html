<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reconocimiento de voz</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="page">
            <header class="hero">
                <div>
                    <p class="eyebrow">Cliente local</p>
                    <h1>Reconocimiento de Voz</h1>
                    <p class="lede">
                        Convierte tu voz en texto, edita la transcripción y
                        reutilízala sin salir del navegador.
                    </p>
                </div>
                <div class="cta">
                    <button
                        type="button"
                        class="ghost"
                        onclick="location.href='chat/index.html'"
                    >
                        Ir al chat AI
                    </button>
                </div>
            </header>

            <section class="panel controls-panel">
                <div class="panel-header">
                    <div
                        class="recording-indicator"
                        id="recordingIndicator"
                        aria-live="polite"
                    >
                        <span class="recording-dot"></span>
                        <span>Grabando...</span>
                    </div>
                    <span class="muted-text">
                        Usa Iniciar y Detener para controlar el reconocimiento.
                    </span>
                </div>

                <div class="button-row">
                    <button type="button" onclick="iniciarReconocimiento()">
                        🎙️ Iniciar
                    </button>
                    <button
                        type="button"
                        class="ghost"
                        onclick="detenerReconocimiento()"
                    >
                        ⏹️ Detener
                    </button>
                    <button type="button" class="ghost" onclick="reset()">
                        Reset
                    </button>
                    <button
                        type="button"
                        class="ghost"
                        onclick="escucharTexto()"
                    >
                        ▶️ Escuchar
                    </button>
                </div>
            </section>

            <section class="panel output-panel">
                <div class="field">
                    <label for="texto">Transcripción</label>
                    <textarea
                        id="texto"
                        rows="10"
                        placeholder="El texto reconocido aparecerá aquí y podrás editarlo..."
                    ></textarea>
                </div>
                <div class="button-row secondary">
                    <button type="button" class="ghost" onclick="copiarTexto()">
                        Copiar
                    </button>
                    <button
                        type="button"
                        class="ghost"
                        onclick="descargarTexto()"
                    >
                        Descargar
                    </button>
                </div>
            </section>
        </main>
        <script src="main.js"></script>
    </body>
</html>
