<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento de voz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Reconocimiento de Voz</h1>
    
    <div class="recording-indicator" id="recordingIndicator">
        <div class="recording-dot"></div>
        <span>GRABANDO...</span>
    </div>
    
    <div class="controls">
        <button onclick="iniciarReconocimiento()">Iniciar</button>
        <button onclick="detenerReconocimiento()">Detener</button>
        <button onclick="reset()">Reset</button>
        <button onclick="copiarTexto()">Copiar</button>
        <button onclick="descargarTexto()">Descargar</button>
        <button onclick="escucharTexto()">Escuchar</button>
    </div>
    
    <textarea id="texto" placeholder="El texto reconocido aparecerá aquí y podrás editarlo..."></textarea>

    <script src="main.js" ></script>
</body>
</html>
