<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gemini Chat</title>
        <link rel="stylesheet" href="../style.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="page">
            <header class="hero">
                <div style="max-width: 70%">
                    <p class="eyebrow">Cliente local</p>
                    <h1>Gemini Chat</h1>
                    <p class="lede">
                        Chatea con Gemini desde tu navegador. Coloca tu
                        <a
                            href="https://aistudio.google.com/app/api-keys"
                            target="_blank"
                            >API key</a
                        >
                        de Google AI Studio, elige el modelo y envía mensajes.
                    </p>
                </div>
                <div class="cta">
                    <button
                        type="button"
                        class="ghost"
                        onclick="location.href='../index.html'"
                    >
                        Ir al Reconocimiento de Voz
                    </button>
                </div>
            </header>

            <section class="panel settings" style="align-items: flex-start">
                <div class="field">
                    <label for="apiKey">API Key</label>
                    <input
                        id="apiKey"
                        type="password"
                        placeholder="AIza..."
                        autocomplete="off"
                    />
                    <div class="helper">
                        La clave se usa solo en tu navegador.
                    </div>
                </div>
                <div class="field">
                    <label for="model">Modelo</label>
                    <select id="model">
                        <option value="gemini-2.5-flash">
                            gemini-2.5-flash
                        </option>
                        <option value="gemini-1.5-pro-latest">
                            gemini-1.5-pro-latest
                        </option>
                        <option value="gemini-1.5-flash-latest">
                            gemini-1.5-flash-latest
                        </option>
                    </select>
                </div>
                <div class="field" style="flex-wrap: wrap">
                    <label for="system">Instrucciones del sistema</label>
                    <textarea
                        id="system"
                        rows="2"
                        placeholder="Establece el rol o tono del asistente"
                    ></textarea>
                </div>
            </section>

            <section class="panel chat">
                <div id="chat-log" class="chat-log" aria-live="polite"></div>

                <div class="field">
                    <label for="texto">Mensaje</label>
                    <textarea
                        id="texto"
                        rows="3"
                        placeholder="Pregúntale algo a Gemini..."
                    ></textarea>
                </div>

                <div
                    id="recordingIndicator"
                    class="recording-indicator"
                    aria-live="polite"
                >
                    <span class="recording-dot"></span>
                    <span>Escuchando...</span>
                </div>

                <div class="actions">
                    <div class="status" id="status"></div>
                    <div class="buttons">
                        <button type="button" onclick="iniciarReconocimiento()">
                            🎙️ Iniciar
                        </button>
                        <button
                            type="button"
                            class="ghost"
                            onclick="detenerReconocimiento()"
                        >
                            ⏹️ Detener
                        </button>
                        <button id="clear" class="ghost" type="button">
                            Limpiar
                        </button>
                        <button id="send" type="button">Enviar</button>
                    </div>
                </div>
            </section>
        </main>

        <script src="../main.js"></script>
        <script src="chat.js"></script>
    </body>
</html>
